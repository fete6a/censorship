name: Build Rust/Wasm LTO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare (requires Actions secrets and provisioned bindings)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python and SQLite tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: Resolve npm deployment lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save dependency lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfiles
          path: |
            Cargo.lock
            tools/history-import/Cargo.lock
            transcoder/Cargo.lock
            package-lock.json
      - name: Rust unit tests
        run: |
          cargo test --lib --locked
          cargo test --manifest-path tools/history-import/Cargo.toml --locked
          cargo test --manifest-path transcoder/Cargo.toml --locked
      - name: Cache Worker build tools
        id: worker-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
            ~/.cache/worker-build
          key: ${{ runner.os }}-${{ runner.arch }}-worker-build-0.8.7-rust-1.99.1
      - name: Install worker-build
        if: steps.worker-tools.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked
      - name: Build optimized Worker with fat LTO
        run: worker-build --release
      - name: Assert build output
        run: |
          test -s build/index.js
          find build -maxdepth 2 -type f -name '*.wasm' -size +0c -print -quit | grep -q .
      - name: Upload Worker build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-worker-fat-lto
          path: build/
          retention-days: 30
          if-no-files-found: error
      - name: Deploy to Cloudflare (explicit dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Configure both GitHub Actions Cloudflare secrets before deployment' >&2
            exit 1
          fi
          npm ci --no-audit --no-fund
          npx wrangler deploy
