name: Build Rust/Wasm LTO

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare (requires Actions secrets and provisioned bindings)'
        type: boolean
        default: false
        required: false

permissions:
  contents: write  # One-time extraction to commit the source files, no secrets in repo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore source from initial seed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.toml ]]; then
            test -s source.bundle.b64
            base64 -d source.bundle.b64 | gzip -d | tar -x
            test -f Cargo.toml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.toml src wrangler.jsonc migrations tests tools transcoder README_CN.md README.md package.json .gitignore .env.example build-lto.sh
            git commit -m 'Add Rust Telegram moderator source (silent multi-group)'
            git push origin HEAD:main
          fi
      - name: Python and SQLite tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install worker-build
        run: cargo install worker-build --locked
      - name: Build optimized Worker with fat LTO
        run: worker-build --release
      - name: Assert build output
        run: |
          test -s build/index.js
          find build -maxdepth 2 -type f -name '*.wasm' -size +0c -print -quit | grep -q .
      - name: Upload Worker build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-worker-fat-lto
          path: build/
          retention-days: 30
          if-no-files-found: error
      - name: Deploy to Cloudflare (explicit dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Configure both GitHub Actions Cloudflare secrets before deployment' >&2
            exit 1
          fi
          npm install --no-audit --no-fund
          npx wrangler deploy