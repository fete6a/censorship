name: Build Rust/Wasm LTO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare (requires Actions secrets and provisioned bindings)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && 'deploy' || 'build' }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy != true }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python and SQLite tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust unit tests
        run: |
          cargo test --lib
          cargo test --manifest-path tools/history-import/Cargo.toml
          cargo test --manifest-path transcoder/Cargo.toml
      - name: Cache Worker build tools
        id: worker-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cache/worker-build
          key: ${{ runner.os }}-${{ runner.arch }}-worker-tools-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-worker-tools-
      - name: Install worker-build
        run: cargo install worker-build
      - name: Build optimized Worker with fat LTO
        run: worker-build --release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Built Worker queue and group authorization regression tests
        run: node --experimental-vm-modules tests/worker_runtime.mjs
      - name: Assert build output
        run: |
          test -s build/index.js
          find build -maxdepth 2 -type f -name '*.wasm' -size +0c -print -quit | grep -q .
      - name: Upload Worker build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-worker-fat-lto
          path: build/
          retention-days: 30
          if-no-files-found: error
      - name: Deploy to Cloudflare (explicit dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Configure both GitHub Actions Cloudflare secrets before deployment' >&2
            exit 1
          fi
          npm install --package-lock=false --no-audit --no-fund
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
