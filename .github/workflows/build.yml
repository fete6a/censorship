name: Build Rust/Wasm LTO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust unit tests
        run: |
          cargo test --manifest-path tools/maintenance/Cargo.toml --locked
          cargo test --lib
          cargo test --manifest-path tools/history-import/Cargo.toml
          cargo test --manifest-path transcoder/Cargo.toml
      - name: Cache Worker build tools
        id: worker-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cache/worker-build
          key: ${{ runner.os }}-${{ runner.arch }}-worker-tools-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-worker-tools-
      - name: Install worker-build
        run: cargo install worker-build
      - name: Build optimized Worker with fat LTO
        run: worker-build --release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Built Worker queue and group authorization regression tests
        run: node --experimental-vm-modules tests/worker_runtime.mjs
      - name: Audit generated JS and preserve built-Wasm host coverage
        run: cargo run --manifest-path tools/maintenance/Cargo.toml --bin js-inventory -- build
      - name: Assert build output
        run: |
          test -s build/index.js
          test -s build/index_bg.wasm
          sha256sum build/index.js build/index_bg.wasm > build/SHA256SUMS
      - name: Upload Worker build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-worker-fat-lto
          path: build/
          retention-days: 30
          if-no-files-found: error
