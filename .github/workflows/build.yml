name: Build Rust/Wasm LTO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare (requires Actions secrets and provisioned bindings)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python and SQLite tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust unit tests
        run: |
          cargo test --lib
          cargo test --manifest-path tools/history-import/Cargo.toml
          cargo test --manifest-path transcoder/Cargo.toml
      - name: Cache Worker build tools
        id: worker-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cache/worker-build
          key: ${{ runner.os }}-${{ runner.arch }}-worker-tools-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-worker-tools-
      - name: Install worker-build
        run: cargo install worker-build
      - name: Build optimized Worker with fat LTO
        run: worker-build --release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Built Worker queue and group authorization regression tests
        run: node --experimental-vm-modules tests/worker_runtime.mjs
      - name: Assert build output
        run: |
          test -s build/index.js
          test -s build/index_bg.wasm
          sha256sum build/index.js build/index_bg.wasm > build/SHA256SUMS
      - name: Upload Worker build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-worker-fat-lto
          path: build/
          retention-days: 30
          if-no-files-found: error

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download tested Worker artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-worker-fat-lto
          path: build/
      - name: Deploy verified artifact and check health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-ci.sh
