name: One-time production deployment dispatch
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: ${{ github.repository == 'fete6a/censorship' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the existing migration-first deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main -f deploy=true
