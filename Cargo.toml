[package]
name = "telegram-clef-omni-moderator"
version = "2.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Pure-Rust HTML5 character-reference decoding; preserve the bounded structural scanner.
html5gum = { version = "0.8.4", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# Preserve target_features for wasm-bindgen's externref transform.
strip = "debuginfo"
panic = "abort"
