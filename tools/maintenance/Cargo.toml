[package]
name = "censorship-maintenance"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "check-d1-schema"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
